 ['Orsetti gommosi','#f788af','•',11,0.18,285,1,'normal'],['Pistola OP','#fffb63','✦',85,0.07,500,1,'laser'],

 [890,620,160,128,'ARCADE WOW','#ff7daf','#ffe38a'],[1220,580,176,144,'CINEMA POP','#9cabf1','#fff0a8'],

];

for(let i=0;i<58;i++){let x=170+(i%10)*214+hash(i,0)*37,y=210+Math.floor(i/10)*224+hash(i,8)*54,w=76+(i%3)*12,h=58+(i%4)*10;
 if(Math.hypot(x-hero.x,y-hero.y)<250)continue;
 if(buildings.some(b=>Math.abs(x-b.x)<(b.w+w)/2+16&&Math.abs(y-b.y)<(b.h+h)/2+16))continue;
 buildings.push({x,y,w,h,name:'CASA',wall:['#f3a9aa','#d1b7ed','#a5d8d3','#eac58e','#b1bde3'][i%5],roof:['#f2d278','#d3addf','#a0d2e3'][i%3]})
}
function inBuilding(x,y,pad=0){for(const b of buildings)if(x>b.x-b.w/2-pad&&x<b.x+b.w/2+pad&&y>b.y-b.h/2-pad&&y<b.y+b.h/2+pad)return true;return false}
function safePoint(seed,minD=0){for(let n=0;n<1200;n++){let x=70+hash(seed+n,34)* (WORLD.w-140),y=70+hash(seed+n,93)*(WORLD.h-140);
 if(!inBuilding(x,y,28)&&Math.hypot(x-hero.x,y-hero.y)>minD)return{x,y}}return{x:100+seed%1900,y:140+seed%1300}}

 let dx=input.x,dy=input.y;if(keys['KeyW']||keys['ArrowUp'])dy-=1;if(keys['KeyS']||keys['ArrowDown'])dy+=1;if(keys['KeyA']||keys['ArrowLeft'])dx-=1;if(keys['KeyD']||keys['ArrowRight'])dx+=1;
 let l=Math.hypot(dx,dy);if(l>.1){dx/=Math.max(1,l);dy/=Math.max(1,l);hero.dir=dx>=0?1:-1; if(!input.shoot)lastAimAngle=Math.atan2(dy,dx)}else{dx=0;dy=0}

 }for(let i=bullets.length-1;i>=0;i--)if(bullets[i].life<=0)bullets.splice(i,1);

 }
 for(const n of npcs){n.step+=dt*1.3; n.effect=Math.max(0,n.effect-dt)}

function gameLoop(timestamp){let dt=Math.min(.045,(timestamp-last)/1000||0);last=timestamp;if(started&&!paused)update(dt);draw();requestAnimationFrame(gameLoop)}requestAnimationFrame(gameLoop);
// Touch joystick: pointer captures allow moving without losing grip on iPhone Safari.
const area=$('stickArea'),knob=$('stickKnob');function moveStick(e){const b=area.getBoundingClientRect(),cx=b.left+b.width/2,cy=b.top+b.height/2,r=b.width*.37;let vx=e.clientX-cx,vy=e.clientY-cy,l=Math.hypot(vx,vy),scale=l>r?r/l:1;vx*=scale;vy*=scale;input.x=vx/r;input.y=vy/r;knob.style.transform=`translate(calc(-50% + ${vx}px),calc(-50% + ${vy}px))`}
area.addEventListener('pointerdown',e=>{e.preventDefault();touchPointer=e.pointerId;area.setPointerCapture(e.pointerId);moveStick(e)});
area.addEventListener('pointermove',e=>{if(e.pointerId===touchPointer){e.preventDefault();moveStick(e)}});
function stopStick(e){if(e.pointerId!==touchPointer)return;touchPointer=null;input.x=0;input.y=0;knob.style.transform='translate(-50%,-50%)'}
area.addEventListener('pointerup',stopStick);area.addEventListener('pointercancel',stopStick);
function touchButton(id,fn,hold=false){const el=$(id);el.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();if(!hold&&el.setPointerCapture)el.setPointerCapture(e.pointerId);el.classList.add('pressed');fn(true)});if(hold){const end=()=>{el.classList.remove('pressed');fn(false)};el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);el.addEventListener('pointerleave',end)}else{el.addEventListener('pointerup',()=>el.classList.remove('pressed'));el.addEventListener('pointercancel',()=>el.classList.remove('pressed'))}}
touchButton('shoot',v=>{input.shoot=v},true);touchButton('dash',()=>dash());touchButton('interact',()=>{if(!paused)interact()});touchButton('fly',()=>{if(!paused)runCheat('fly')});touchButton('weaponButton',showWeapons);touchButton('chatButton',showChat);touchButton('menuButton',showPause);
$('btnCheats').onclick=showCheats;$('btnMap').onclick=()=>{showMap=!showMap;notice(showMap?'MAPPA VISIBILE':'MAPPA NASCOSTA')};
canvas.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'){const r=canvas.getBoundingClientRect();const x=e.clientX/r.width*VW,y=e.clientY/r.height*VH;lastAimAngle=Math.atan2(y-VH/2,x-VW/2)}});
canvas.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&!paused){input.shoot=true;e.preventDefault()}});
window.addEventListener('pointerup',e=>{if(e.pointerType==='mouse')input.shoot=false});
window.addEventListener('keydown',e=>{if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(document.activeElement&&document.activeElement.tagName==='INPUT')return;keys[e.code]=true;if(e.repeat)return;
 if(e.code==='Escape')paused?closePanel():showPause();if(e.code==='KeyE'&&!paused)interact();if(e.code==='KeyB')showWeapons();if(e.code==='KeyT')showChat();if(e.code==='KeyX')showCheats();if(e.code==='KeyF'&&!paused)runCheat('fly');if(e.code==='ShiftLeft'||e.code==='ShiftRight')dash();if(e.code==='Slash')showChat();});
window.addEventListener('keyup',e=>keys[e.code]=false);
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('touchmove',e=>{if(!e.target.closest('#panel'))e.preventDefault()},{passive:false});
intro();
